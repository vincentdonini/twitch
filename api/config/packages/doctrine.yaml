doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            DomainAchievement:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Domain/Achievement/Entity'
                prefix: 'App\Domain\Achievement\Entity'
                alias: DomainAchievement
            DomainBenchmark:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Domain/Benchmark/Entity'
                prefix: 'App\Domain\Benchmark\Entity'
                alias: DomainBenchmark
            DomainContent:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Domain/Content/Entity'
                prefix: 'App\Domain\Content\Entity'
                alias: DomainContent
            DomainEquipment:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Domain/Equipment/Entity'
                prefix: 'App\Domain\Equipment\Entity'
                alias: DomainEquipment
            DomainExercise:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Domain/Exercise/Entity'
                prefix: 'App\Domain\Exercise\Entity'
                alias: DomainExercise
            DomainGeo:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Domain/Geo/Entity'
                prefix: 'App\Domain\Geo\Entity'
                alias: DomainGeo
            DomainMuscle:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Domain/Muscle/Entity'
                prefix: 'App\Domain\Muscle\Entity'
                alias: DomainMuscle
            DomainOrganization:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Domain/Organization/Entity'
                prefix: 'App\Domain\Organization\Entity'
                alias: DomainOrganization
            DomainRefreshToken:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Domain/RefreshToken/Entity'
                prefix: 'App\Domain\RefreshToken\Entity'
                alias: RefreshToken
            DomainSecurity:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Domain/Security/Entity'
                prefix: 'App\Domain\Security\Entity'
                alias: DomainSecurity
            DomainUser:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Domain/User/Entity'
                prefix: 'App\Domain\User\Entity'
                alias: DomainUser
            DomainWod:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Domain/Wod/Entity'
                prefix: 'App\Domain\Wod\Entity'
                alias: DomainWod

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
