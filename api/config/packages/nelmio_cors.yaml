nelmio_cors:
    defaults:
        allow_origin: ['https://front.twitch.woder.local']
        allow_methods: ['GET', 'POST', 'OPTIONS', 'PUT', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization']
        expose_headers: []
        max_age: 3600
        hosts: []
    paths:
        '^/':  # Applique CORS à toutes les routes
            allow_origin: ['https://front.twitch.woder.local']
            allow_methods: ['GET', 'POST', 'OPTIONS', 'PUT', 'DELETE']
            allow_headers: ['Content-Type', 'Authorization']
