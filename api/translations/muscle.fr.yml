lower_abdominals:
  name: "Abdominaux inférieurs"
  description: "Partie basse des muscles abdominaux, importante pour la stabilité pelvienne et la force du bas du tronc."
upper_abdominals:
  name: "Abdominaux supérieurs"
  description: "Partie haute des muscles abdominaux, activée lors des mouvements de flexion du tronc."
long_head_triceps:
  name: "Long chef du triceps"
  description: "Le plus grand chef du triceps, sollicité dans les extensions au-dessus de la tête et l'adduction du bras."
lateral_head_triceps:
  name: "Chef latéral du triceps"
  description: "Partie extérieure du triceps, contribuant à l'extension du bras et à la largeur du bras."
medial_head_triceps:
  name: "Chef médial du triceps"
  description: "Le plus petit chef du triceps, actif dans tous les mouvements d'extension du bras."
long_head_biceps:
  name: "Long chef du biceps"
  description: "Partie extérieure du biceps, responsable de la flexion du bras et de la stabilisation de l'épaule."
short_head_biceps:
  name: "Chef court du biceps"
  description: "Partie intérieure du biceps, jouant un rôle dans la flexion du bras et la largeur du bras."
wrist_extensors:
  name: "Extenseurs du poignet"
  description: "Muscles responsables de l'extension du poignet et des doigts, essentiels pour la prise et la levée."
wrist_flexors:
  name: "Fléchisseurs du poignet"
  description: "Muscles responsables de la flexion du poignet, fondamentaux pour la force de la main et de l'avant-bras."
lateral_deltoid:
  name: "Deltoïde latéral"
  description: "Partie médiane du muscle de l'épaule, responsable de l'abduction du bras."
anterior_deltoid:
  name: "Deltoïde antérieur"
  description: "Partie avant du muscle de l'épaule, impliquée dans la flexion de l'épaule et les élévations frontales."
posterior_deltoid:
  name: "Deltoïde postérieur"
  description: "Partie arrière du muscle de l'épaule, engagée dans les mouvements de tirage et les mouvements postérieurs."
front_shoulders:
  name: "Épaules avant"
  description: "Terme général pour désigner les muscles impliqués dans les mouvements antérieurs de l'épaule."
rear_shoulders:
  name: "Épaules arrière"
  description: "Muscles situés à l'arrière de l'épaule, importants pour la posture et les mouvements de tirage."
lats:
  name: "Grand dorsal"
  description: "Grand muscle du dos, essentiel pour les mouvements de tirage, de levage et le maintien de la colonne vertébrale."
upper_traps:
  name: "Trapèze supérieur"
  description: "Partie supérieure du muscle trapèze, responsable de l'élévation des épaules et de la stabilité du cou."
lower_traps:
  name: "Trapèze inférieur"
  description: "Partie inférieure du muscle trapèze, soutenant le mouvement des omoplates et la posture du tronc."
mid_back:
  name: "Milieu du dos"
  description: "Muscles centraux du dos, cruciaux pour la posture, la force de tirage et la stabilité du tronc."
lower_back:
  name: "Bas du dos"
  description: "Muscles soutenant la stabilité de la colonne lombaire et les mouvements du tronc."
neck:
  name: "Cou"
  description: "Muscles autour de la colonne cervicale, soutenant les mouvements de la tête et la posture."
upper_pectoralis:
  name: "Pectoraux supérieurs"
  description: "Partie supérieure des muscles pectoraux, fortement sollicitée dans les exercices d'inclinaison."
mid_and_lower_chest:
  name: "Pectoraux moyens et inférieurs"
  description: "Parties centrale et inférieure des muscles pectoraux, activées lors des exercices sur banc plat ou décliné."
gluteus_medius:
  name: "Moyen fessier"
  description: "Muscle situé sur la face externe du bassin, important pour la stabilité de la hanche et l'abduction de la jambe."
gluteus_maximus:
  name: "Grand fessier"
  description: "Le plus grand muscle des fesses, responsable de l'extension et de la rotation de la hanche."
medial_hamstrings:
  name: "Ischio-jambiers médiaux"
  description: "Partie interne du groupe des ischio-jambiers, contribuant à la flexion du genou et à l'extension de la hanche."
lateral_hamstrings:
  name: "Ischio-jambiers latéraux"
  description: "Partie externe des muscles ischio-jambiers, impliquée dans la flexion du genou et l'extension de la hanche."
inner_quadriceps:
  name: "Quadriceps interne"
  description: "Section médiale du quadriceps, jouant un rôle clé dans l'extension du genou et la stabilité des jambes."
outer_quadriceps:
  name: "Quadriceps externe"
  description: "Section latérale du quadriceps, contribuant à l'extension du genou et à la stabilisation externe de la jambe."
rectus_femoris:
  name: "Droit fémoral"
  description: "Muscle central du quadriceps, traversant la hanche et le genou, actif dans les mouvements de poussée et de saut."
gastrocnemius:
  name: "Gastrocnémiens"
  description: "Muscle du mollet responsable de la flexion plantaire de la cheville et de la puissance des jambes."
soleus:
  name: "Soléaire"
  description: "Muscle profond du mollet, essentiel pour l'endurance et la stabilité en station debout."
inner_thigh:
  name: "Intérieur de la cuisse"
  description: "Muscles de la face interne de la cuisse, importants pour l'adduction de la jambe et la stabilité pelvienne."
groin:
  name: "Aine"
  description: "Muscles reliant l'intérieur de la cuisse au bassin, essentiels pour les mouvements des jambes et la stabilité de la hanche."
tibialis:
  name: "Tibial antérieur"
  description: "Muscle situé à l'avant du tibia, responsable de la dorsiflexion du pied."
feet:
  name: "Muscles du pied"
  description: "Petits muscles du pied, fondamentaux pour l'équilibre, la posture et l'agilité."
hands:
  name: "Muscles de la main"
  description: "Petits muscles permettant la mobilité fine des doigts, la force de préhension et la précision des mouvements."
obliques:
  name: "Muscles obliques"
  description: "Muscles situés sur les côtés de l'abdomen, essentiels pour la rotation du tronc, la stabilité du tronc et le soutien de la posture."

area:
  core:
    name: "Ceinture abdominale"
    description: "Muscles de l’abdomen et du bas du dos qui stabilisent la colonne vertébrale et le bassin."
  arms:
    name: "Bras"
    description: "Inclut les biceps, triceps et avant-bras — responsables des mouvements du coude et de la force de préhension."
  shoulders:
    name: "Épaules"
    description: "Muscles deltoïdes qui contrôlent les mouvements de l’épaule et la rotation du bras supérieur."
  back:
    name: "Dos"
    description: "Inclut les muscles du haut, du milieu et du bas du dos comme les dorsaux et les trapèzes, essentiels aux mouvements de tirage."
  chest:
    name: "Poitrine"
    description: "Muscles pectoraux utilisés dans les mouvements de poussée et pour la force du haut du corps."
  glutes:
    name: "Fessiers"
    description: "Grand, moyen et petit fessier — muscles clés pour l’extension de la hanche et la stabilité."
  hamstrings:
    name: "Ischio-jambiers"
    description: "Muscles à l’arrière de la cuisse impliqués dans la flexion du genou et l’extension de la hanche."
  quadriceps:
    name: "Quadriceps"
    description: "Grands muscles à l’avant de la cuisse qui permettent l’extension du genou et stabilisent les mouvements."
  calves:
    name: "Mollets"
    description: "Muscles de la jambe inférieure, incluant les jumeaux et le soléaire, importants pour les mouvements de la cheville et du pied."
  adductors:
    name: "Adducteurs"
    description: "Muscles de l’intérieur de la cuisse responsables du rapprochement des jambes vers l’axe du corps."
  lower_leg:
    name: "Jambe inférieure"
    description: "Muscles situés sous le genou, essentiels pour le mouvement de la cheville, l'équilibre et la propulsion lors de la marche et de la course."
    
group:
  abdominals:
    name: "Abdominaux"
    description: "Groupe de muscles situés à l'avant de l'abdomen, responsables de la force et de la stabilité du tronc."
  triceps:
    name: "Triceps"
    description: "Muscle à trois chefs à l'arrière du bras, essentiel pour l'extension du coude et les mouvements de poussée."
  biceps:
    name: "Biceps"
    description: "Muscle à deux chefs à l'avant du bras, responsable de la flexion du coude et de la rotation de l'avant-bras."
  forearms:
    name: "Avant-bras"
    description: "Muscles situés entre le coude et le poignet, cruciaux pour la force de préhension et les mouvements du poignet."
  deltoid:
    name: "Deltoïde"
    description: "Muscle principal de l'épaule divisé en parties antérieure, latérale et postérieure, responsable de l'élévation et de la rotation du bras."
  traps:
    name: "Trapèze"
    description: "Large muscle triangulaire du dos et du cou, contrôlant la posture et les mouvements des omoplates."
